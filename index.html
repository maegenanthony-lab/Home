<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Our Home</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d2a24;--mute:#6b7771;--green:#2f5d4a;--dark:#14231d;--line:#e3ded5;--soft:#e4ebe5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex}
.serif{font-family:Georgia,"Times New Roman",serif;font-style:italic}
nav{width:190px;background:var(--dark);color:#dfe8e3;padding:20px 12px;display:flex;flex-direction:column;flex-shrink:0;padding-top:max(20px,env(safe-area-inset-top))}
nav h1{margin:0 0 4px 8px;font-size:30px;font-weight:400}
nav small{margin:0 0 22px 8px;color:#9db1a8;font-size:12px;letter-spacing:.08em}
nav a{color:inherit;text-decoration:none;padding:11px 12px;border-radius:10px;margin-bottom:4px}
nav a:active{background:#2b4439}
nav p{margin:auto 8px 0;font-size:18px;color:#c9d6cf}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 24px 40px;padding-top:max(18px,env(safe-area-inset-top))}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
header h2{margin:0;font-size:40px;font-weight:400}
header .d{color:var(--mute);letter-spacing:.06em;font-size:13px;margin-top:4px}
.clock{font-size:44px;font-weight:300;text-align:right;line-height:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.card.wide{grid-column:1/-1}
@media (max-width:900px){.grid{grid-template-columns:1fr}nav{width:150px}header h2{font-size:32px}.clock{font-size:34px}}
.card h3{margin:0 0 12px;font-size:20px}
.card h4{margin:14px 0 6px;font-size:15px;color:var(--mute);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0ece4}
li span{flex:1}
li.done span{text-decoration:line-through;color:#a2aaa5}
.tag{font-size:12px;background:var(--soft);color:var(--green);border-radius:20px;padding:2px 9px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--green);background:#fff;color:#fff;font-size:16px;flex-shrink:0;padding:0}
.done .chk{background:var(--green)}
.x{border:0;background:none;color:#b5aca0;font-size:22px;padding:0 6px}
.add{display:flex;gap:8px;margin-top:12px}
input,select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:0}
.add input{flex:1}
.btn{background:var(--green);color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:22px}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs .on{background:var(--green);color:#fff;border-color:var(--green)}
.empty{color:var(--mute);padding:8px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.meal{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.meal.today input{background:var(--soft);border-color:var(--green)}
.meal b{color:var(--mute);font-size:14px}
.note{color:var(--mute);font-size:13px;margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.tm{width:78px;font-weight:600;font-size:14px;color:var(--mute);flex-shrink:0}
#calBox h4:first-child{margin-top:0}
</style></head>
<body>
<div id="login" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:#14231d;align-items:center;justify-content:center"><div class="card" style="width:340px"><h3 class="serif" style="font-size:28px;font-weight:400">Our Home</h3><p class="note">Sign in once on this device.</p><input id="em" type="email" autocomplete="username" placeholder="Family email" style="width:100%;margin-bottom:8px"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="btn" id="go" style="width:100%;padding:12px;font-size:17px">Sign in</button><p class="note" id="lerr" style="color:#a33"></p></div></div>
<div id="dim" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#000;color:#3c3c3c;align-items:center;justify-content:center;font-size:72px;font-weight:200;cursor:pointer"></div>
<nav>
  <h1 class="serif">Our Home</h1><small>FAMILY · FAITH · HARMONY</small>
  <a href="#cal">Calendar</a><a href="#todo">To Do</a><a href="#shop">Shopping</a>
  <a href="#rout">Routines</a><a href="#chores">Chores</a><a href="#meals">Meal Plan</a>
  <p class="serif">Together is our favorite place to be</p>
</nav>
<main>
  <header>
    <div><h2 class="serif" id="greet"></h2><div class="d" id="date"></div><div id="wx" style="margin-top:8px;font-size:18px"></div></div>
    <div><div class="clock" id="clock"></div><div class="note" id="sync" style="text-align:right;margin:4px 0 0"></div></div>
  </header>
  <div class="grid">
    <section class="card wide" id="verse"></section>
    <section class="card" id="cal"><h3>Family Calendar <button class="ghost" style="float:right" data-a="cal">Refresh</button></h3><div id="calBox"></div></section>
    <section class="card" id="todo"><h3>Today's To-Do</h3><div id="todoBox"></div>
      <h4>Reminders</h4><div id="remBox"></div></section>
    <section class="card" id="rout"><h3>Routines</h3><div class="cols" id="routBox"></div>
      <p class="note">Routines uncheck themselves each new day.</p></section>
    <section class="card" id="shop"><h3>Shopping Lists</h3><div id="shopBox"></div></section>
    <section class="card wide" id="chores"><h3>Chores</h3><div class="cols" id="choreBox"></div>
      <div class="add"><button class="ghost" data-a="resetChores">Start a new week (uncheck all chores)</button></div></section>
    <section class="card wide" id="meals"><h3>Dinner &amp; Meal Plan</h3><div id="mealBox"></div></section>
  </div>
</main>

var auth=firebase.auth(),DOC=firebase.firestore().collection('families').doc('main');
var S={},last={},ready=false,unsub=null;
try{S.tab=localStorage.getItem('ourhome_tab')||undefined}catch(e){}
function setSync(t){document.getElementById('sync').textContent=t}
function save(){
  try{localStorage.setItem('ourhome_tab',S.tab||'')}catch(e){}
  var up={},n=0;
  Object.keys(S).forEach(function(k){if(k==='tab')return;var j=JSON.stringify(S[k]);if(j!==last[k]){up[k]=S[k];last[k]=j;n++}});
  if(n&&ready)DOC.set(up,{merge:true}).catch(function(){setSync('Not saved - check connection')});
}
function safeRender(){var a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.value){setTimeout(safeRender,3000)}else render()}
function rollover(){if(ready&&S.day!==today()){CFG.routines.forEach(function(r){L('r:'+r).forEach(function(i){i.d=0})});S.day=today();save()}}
auth.onAuthStateChanged(function(u){
  var lg=document.getElementById('login');
  if(!u){lg.style.display='flex';if(unsub){unsub();unsub=null}ready=false;return}
  lg.style.display='none';
  unsub=DOC.onSnapshot(function(snap){
    var tab=S.tab,d=snap.exists?snap.data():null;
    if(!d){ // first run: carry this device's old lists up to the shared copy
      try{d=JSON.parse(localStorage.getItem('ourhome'))||{}}catch(e){d={}}
      delete d.tab;last={};S=d;S.tab=tab;ready=true;save();
    }else{
      S=d;S.tab=tab;last={};Object.keys(d).forEach(function(k){last[k]=JSON.stringify(d[k])});ready=true;
    }
    rollover();setSync(snap.metadata.fromCache?'Offline - showing saved copy':'\u25CF Synced');safeRender();
  },function(){setSync('Sync problem - check connection')});
});
function doLogin(){auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value).catch(function(){document.getElementById('lerr').textContent='Sign-in failed. Check the email and password.'})}
document.getElementById('go').addEventListener('click',doLogin);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
setInterval(function(){rollover();safeRender()},60000);
function L(k){return S[k]||(S[k]=[])}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}


function list(k,showTag){
  var a=L(k);if(!a.length)return '<p class="empty">Nothing here yet. Add an item below.</p>';
  return '<ul>'+a.map(function(i,n){
    return '<li class="'+(i.d?'done':'')+'"><button class="chk" data-a="t" data-k="'+esc(k)+'" data-i="'+n+'">'+(i.d?'&#10003;':'')+'</button><span>'+esc(i.t)+'</span>'+
    (showTag&&i.p?'<em class="tag">'+esc(i.p)+'</em>':'')+
    '<button class="x" data-a="d" data-k="'+esc(k)+'" data-i="'+n+'">&times;</button></li>'}).join('')+'</ul>';
}
function adder(k,ph,sel){
  return '<div class="add"><input data-in="'+esc(k)+'" placeholder="'+ph+'">'+
  (sel?'<select data-sel="'+esc(k)+'">'+CFG.people.concat(['Everyone']).map(function(p){return '<option>'+esc(p)+'</option>'}).join('')+'</select>':'')+
  '<button class="btn" data-a="add" data-k="'+esc(k)+'">+</button></div>';
}
function render(){
  var h=new Date().getHours();
  document.getElementById('greet').textContent='Good '+(h<12?'morning':h<18?'afternoon':'evening')+', '+CFG.family;
  var d=new Date();
  document.getElementById('date').textContent=(DAYS[d.getDay()]+', '+d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})).toUpperCase();
  document.getElementById('todoBox').innerHTML=list('todo',1)+adder('todo','Add a task…',1);
  document.getElementById('remBox').innerHTML=list('rem')+adder('rem','Don\'t forget…');
  document.getElementById('routBox').innerHTML=CFG.routines.map(function(r){return '<div><h4>'+esc(r)+'</h4>'+list('r:'+r)+adder('r:'+r,'Add a step…')+'</div>'}).join('');
  var st=S.tab||CFG.stores[0];
  var left=L('s:'+st).filter(function(i){return !i.d}).length;
  document.getElementById('shopBox').innerHTML=
    '<div class="tabs">'+CFG.stores.map(function(s){return '<button class="ghost '+(s===st?'on':'')+'" data-a="tab" data-k="'+esc(s)+'">'+esc(s)+'</button>'}).join('')+'</div>'+
    list('s:'+st)+adder('s:'+st,'Add an item…')+
    '<div class="note">'+left+' left on '+esc(st)+' &nbsp; <button class="ghost" data-a="clear" data-k="s:'+esc(st)+'">Clear checked</button></div>';
  document.getElementById('choreBox').innerHTML=CFG.people.map(function(p){return '<div><h4>'+esc(p)+'</h4>'+list('c:'+p)+adder('c:'+p,'Add a chore…')+'</div>'}).join('');
  var M=S.meals||(S.meals={}),t=new Date().getDay();
  document.getElementById('mealBox').innerHTML=DAYS.map(function(n,i){
    return '<div class="meal '+(i===t?'today':'')+'"><b>'+n.slice(0,3)+'</b><input data-meal="'+i+'" value="'+esc(M[i]||'')+'" placeholder="'+(i===t?'What\'s for dinner tonight?':'Dinner…')+'"></div>'}).join('');
}
function doAdd(k){
  var inp=document.querySelector('[data-in="'+k+'"]');if(!inp||!inp.value.trim())return;
  var sel=document.querySelector('[data-sel="'+k+'"]');
  L(k).push({t:inp.value.trim(),d:0,p:sel?sel.value:''});save();render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),k=b.getAttribute('data-k'),i=+b.getAttribute('data-i');
  if(a==='t')L(k)[i].d=L(k)[i].d?0:1;
  else if(a==='d')L(k).splice(i,1);
  else if(a==='add'){doAdd(k);return}
  else if(a==='tab')S.tab=k;
  else if(a==='clear')S[k]=L(k).filter(function(x){return !x.d});
  else if(a==='resetChores')CFG.people.forEach(function(p){L('c:'+p).forEach(function(x){x.d=0})});
  save();render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.hasAttribute('data-in'))doAdd(e.target.getAttribute('data-in'));
});
document.addEventListener('change',function(e){
  var m=e.target.getAttribute('data-meal');
  if(m!==null){(S.meals||(S.meals={}))[m]=e.target.value;save()}
});
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
var CC=['#2f5d4a','#b5651d','#3b6ea5','#8a4f7d','#a33b3b'];
function loadCal(){
  var box=document.getElementById('calBox');
  if(!CFG.calendarApi){box.innerHTML='<p class="empty">Calendar not connected yet. Paste your Worker address into calendarApi at the top of the script.</p>';return}
  fetch(CFG.calendarApi).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(cals){
    var t0=new Date();t0.setHours(0,0,0,0);var t1=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+7),ev=[];
    cals.forEach(function(c,ci){try{
      var root=new ICAL.Component(ICAL.parse(c.ics));
      root.getAllSubcomponents('vtimezone').forEach(function(z){ICAL.TimezoneService.register(z)});
      var evs=root.getAllSubcomponents('vevent').map(function(v){return new ICAL.Event(v)}),skip={};
      evs.forEach(function(e){if(e.recurrenceId)skip[e.uid+'|'+e.recurrenceId.toJSDate().getTime()]=1});
      function put(s,en,ad,t){if(s<t1&&(en>t0||s>=t0))ev.push({s:s,e:en,ad:ad,t:t,c:ci,n:c.name})}
      evs.forEach(function(e){
        if(e.component.getFirstPropertyValue('status')==='CANCELLED')return;
        var t=e.summary||'(No title)';
        if(e.isRecurring()&&!e.recurrenceId){
          var it=e.iterator(),nx,n=0;
          while((nx=it.next())&&n++<3000){
            var d=e.getOccurrenceDetails(nx),s=d.startDate.toJSDate();
            if(s>=t1)break;
            if(skip[e.uid+'|'+s.getTime()])continue;
            put(s,d.endDate.toJSDate(),d.startDate.isDate,t);
          }
        }else put(e.startDate.toJSDate(),e.endDate.toJSDate(),e.startDate.isDate,t);
      });
    }catch(x){}});
    var html='';
    for(var i=0;i<7;i++){
      var a=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+i),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1);
      var day=ev.filter(function(x){return x.s<b&&(x.e>a||x.s>=a)}).sort(function(p,q){return (q.ad?1:0)-(p.ad?1:0)||p.s-q.s});
      if(!day.length)continue;
      html+='<h4>'+(i===0?'Today':i===1?'Tomorrow':a.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}))+'</h4><ul>'+
      day.map(function(x){return '<li><i class="dot" style="background:'+(CFG.colors[x.n]||'#9aa09c')+'"></i><b class="tm">'+(x.ad?'All day':x.s.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}))+'</b><span>'+esc(x.t)+'</span>'+(cals.length>1?'<em class="tag">'+esc(x.n)+'</em>':'')+'</li>'}).join('')+'</ul>';
    }
    box.innerHTML=(html||'<p class="empty">Nothing scheduled in the next 7 days.</p>')+'<p class="note">Updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'</p>';
  }).catch(function(){box.innerHTML='<p class="empty">Couldn\'t load the calendar. Check the Worker address and your internet connection.</p>'});
}
document.addEventListener('click',function(e){if(e.target.closest('[data-a="cal"]'))loadCal()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadCal()});
setInterval(loadCal,600000);

function verse(){
  var d=new Date(),n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),v=VERSES[n%VERSES.length];
  document.getElementById('verse').innerHTML='<div class="serif" style="font-size:22px;line-height:1.35">&ldquo;'+esc(v[0])+'&rdquo;</div><div class="note" style="margin-top:6px">'+esc(v[1])+' (KJV)</div>';
}
var WX={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',80:'🌧️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
function weather(){
  var w=CFG.weather,el=document.getElementById('wx');if(!w)return;
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1')
  .then(function(r){return r.json()}).then(function(d){
    el.innerHTML='<span style="font-size:26px">'+(WX[d.current.weather_code]||'🌡️')+'</span> <b>'+Math.round(d.current.temperature_2m)+'°</b> &nbsp;High '+Math.round(d.daily.temperature_2m_max[0])+'° &middot; Low '+Math.round(d.daily.temperature_2m_min[0])+'° &middot; '+d.daily.precipitation_probability_max[0]+'% rain';
  }).catch(function(){});
}
var wakeUntil=0;
function dimCheck(){
  var el=document.getElementById('dim'),h=new Date().getHours(),f=CFG.dim.from,t=CFG.dim.to;
  var night=f>t?(h>=f||h<t):(h>=f&&h<t);
  if(night&&Date.now()>wakeUntil){el.style.display='flex';el.textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
  else el.style.display='none';
}
document.getElementById('dim').addEventListener('click',function(){wakeUntil=Date.now()+300000;dimCheck()});
setInterval(dimCheck,20000);setInterval(weather,1800000);setInterval(verse,60000);
tick();setInterval(tick,30000);render();loadCal();verse();weather();dimCheck();
// re-render at midnight rollover / when the iPad wakes
document.addEventListener('visibilitychange',function(){if(!document.hidden){rollover();safeRender()}});
</script>
</body></html>
